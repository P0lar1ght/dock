[package]
name = "cordis-base"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Dock spine 的底座：wire 类型、config.toml、纯引擎。不含任何插件"
license = "Apache-2.0"

[dependencies]
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = true, features = ["json", "stream", "gzip", "brotli", "deflate"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "fs", "io-util", "macros", "process"] }
toml = "0.8"
toml_edit = "0.22"
tempfile = "3"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
