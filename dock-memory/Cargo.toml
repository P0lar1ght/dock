[package]
name = "dock-memory"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Dock cross-session memory: topics/_inbox layout, FTS+vec hybrid search, flush, dream"
license = "Apache-2.0"

[dependencies]
arc-swap = "1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cordis-base = { path = "../cordis-base" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
sqlite-vec = "=0.1.7-alpha.2"
thiserror = "2"
tracing = "0.1"
tempfile = "3"

[dev-dependencies]
tempfile = "3"
