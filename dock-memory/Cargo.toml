[package]
name = "dock-memory"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Dock cross-session memory: topics/_inbox layout, FTS+vec hybrid search, flush, dream"
license = "Apache-2.0"

[dependencies]
arc-swap = "1"
async-trait = "0.1"
blake3 = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cordis-base = { path = "../cordis-base" }
notify = "7"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlite-vec = "=0.1.7-alpha.2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "time"] }
tracing = "0.1"
tempfile = "3"

[features]
default = []
test-support = []

[dev-dependencies]
tempfile = "3"
