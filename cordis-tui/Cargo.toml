[package]
name = "cordis-tui"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Grok pager TUI as Cordis plugins (theme, scrollback, prompt, status, welcome, event loop)"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
anstyle = "1.0"
cordis = { path = "../cordis-rust" }
cordis-markdown = { path = "../dock-render/markdown" }
cordis-spine = { path = "../cordis-spine" }
crossterm = { version = "0.28", features = ["event-stream"] }
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "5b74652" }
ratatui = { version = "0.29", features = ["crossterm"] }
serde_json = "1"
textwrap = "0.16"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
syntect = "5.3"
xai-fuzzy-file-search = { path = "fuzzy-file-search" }
xai-grok-mermaid = { path = "../dock-render/mermaid" }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dev-dependencies]
pretty_assertions = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
