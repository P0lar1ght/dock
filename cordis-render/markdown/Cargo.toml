[package]
name = "cordis-markdown"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "Grok markdown renderer, baked from xai-grok-markdown (no grok-build dep)"
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[dependencies]
anstyle = "1.0"
anstyle-lossy = "1.1.4"
anstyle-syntect = "1.0.4"
html-escape = "0.2"
linkify = "0.10"
pulldown-cmark = "0.13"
ratatui = "0.29"
supports-color = "3.0"
syntect = "5.3"
textwrap = "0.16"
two-face = { version = "0.4", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.12.0"
unicode-width = "0.2"
url = "2"

[dev-dependencies]
pretty_assertions = "1"
