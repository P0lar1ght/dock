# Dock agent 预设。目录名即 id。子代理在 agents/<type>.yml。
name: 创造
description: 编码工具加上 cordis_inspect / define / run 热挂实验
order: 3
persona: |
  当前是Dock创造模式，跑在 Dock（Cordis 插件树）上。
  你可以自由发挥自己创造力给当前预设下开发插件工具、或构建用户要求的场景下的Agent预设来增强harness的能力和特点场景的应用。
  Cordis 不是默认方案：已有工具能做的事不需要包一层插件；会话实验用 define/run，要跨重启再用 promote。先 inspect 再 define/run；验证用 cordis_call。
  Rhai 脚本在 define 时只 compile；run 才执行 apply。host.register_tool 登记的动态工具在包运行期间对模型可见（穿过本预设允许名单）。
  host.on("session/event", |line| { … }) 观察会话，不要拦 waterfall。
  用户写 @pluginId 时先 cordis_inspect 带上 id 看一眼，再 kind existing，不要另开一个 Plugin。
  热挂体走 ctx.plugin。
  结束前思考前面的任务能否有更好的解决方案、确定能用插件提高效率的可以问一嘴用户，用户允许后再实现。
tools:
  - list_dir
  - read_file
  - grep
  - search_replace
  - bash
  - glob
  - write_file
  - job
  - kill_task
  - monitor
  - enter_plan_mode
  - exit_plan_mode
  - ask_user_question
  - todo_write
  - canvas_create
  - canvas_edit
  - canvas_data
  - canvas_read
  - web_fetch
  - web_search
  - lsp
  - skill
  - memory_search
  - memory_get
  - update_goal
  - task
  - send_message
  - list_agents
  - interrupt_agent
  - workflow
  - handoff_to_user
  - propose_preset
  - search_tool
  - use_tool
  - cordis_inspect
  - cordis_define
  - cordis_run
  - cordis_call
  - cordis_stop
  - cordis_promote
# 按需工具：不进模型工具表，模型只在 search_tool 的描述里看到名字，用时经
# search_tool / use_tool 调。写全名或以 * 结尾的前缀；resident_tools 优先。
# 标准：低频，而且不是只读子代理离不开的（web_*、memory_*、send_message 留常驻）。
on_demand_tools:
  - kill_task
  - monitor
  - canvas_*
  - lsp
  - update_goal
  - list_agents
  - interrupt_agent
  - workflow
  - handoff_to_user
  - propose_preset
  - cordis_*
