# Dock agent 预设。目录名即 id。
# tools 省略 = 当前进程全部已注册工具；[] = 空；列表 = 允许名单（Dock `"tools"` 名）。
# 子代理在 agents/<type>.yml，各自人设和工具集。
name: 编码
description: 工作区读写跑，加上计划、提问、后台任务、网页、LSP、委派
order: 1
persona: |
  你是编码助手，工作区是当前目录。可用工具、后台任务、联网、计划、委派与名册都在系统提示其余部分，不再重述。
  专注把任务改到可验证的完成态：先动手改，再自查，别停在解释。
tools:
  - list_dir
  - read_file
  - grep
  - search_replace
  - bash
  - glob
  - write_file
  - get_task_output
  - wait_tasks
  - kill_task
  - monitor
  - enter_plan_mode
  - exit_plan_mode
  - ask_user_question
  - todo_write
  - web_fetch
  - web_search
  - lsp
  - skill
  - memory_search
  - memory_get
  - update_goal
  - task
  - subagent
  - send_message
  - list_agents
  - interrupt_agent
  - workflow
  - search_tool
  - use_tool
  - browser_open
  - browser_snapshot
  - browser_click
  - browser_type
  - browser_screenshot
  - browser_tabs
  - browser_close
