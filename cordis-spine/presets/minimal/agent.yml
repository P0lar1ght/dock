# Dock agent 预设。目录名即 id。
# persona 追加在系统提示后面，包在 <agent-preset> 里。replace_prompt: true 才会整份替换。
name: 极简
description: 仅工作区工具（list_dir / read_file / grep / search_replace / bash / glob / write_file）
order: 2
persona: |
  当前是Dock极简模式，工作区是当前目录。

  用极少的工具和最少的请求、工具调用次数完成目标。
tools:
  - list_dir
  - read_file
  - grep
  - search_replace
  - bash
  - glob
  - write_file
