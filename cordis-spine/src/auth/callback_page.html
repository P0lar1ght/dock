<!DOCTYPE html>
<!--
  浏览器授权回调页（ChatGPT 订阅登录、MCP 服务器 OAuth 共用）。
  由 cordis-spine/src/auth/callback_page.rs 拼出来：这里只是**前半页**——收到回调
  就先发出去（「正在连接…」）；换码有了结果，Rust 再补一段调用 settle(结果) 的脚本
  并收尾 body / html，然后关连接。没等到 settle 连接就关了 = 登录被中断。
  颜色 / 字体 / 缓动 / 玻璃参数取自 dock-gui/src/styles.css；品牌标与描线动效同
  dock-gui 的启动画面（assets/markPath.ts、LaunchSplash）。
  {{SERVICE}} 由 Rust 转义后填入。
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:,">
<title>正在连接 {{SERVICE}}…</title>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  --ink: #1c1c1e;
  --ink-2: #3a3a3c;
  --ink-3: #636366;
  --ink-4: #8e8e93;
  --page: oklch(0.925 0.007 265);
  --glow-a: oklch(0.84 0.08 250 / 0.7);
  --glow-b: oklch(0.88 0.06 305 / 0.6);
  --card: oklch(0.995 0.002 265 / 0.58);
  --card-solid: oklch(0.985 0.003 265);
  --rim: oklch(1 0 0 / 0.9);
  --edge: oklch(0.38 0.03 265 / 0.12);
  --contact: oklch(0.25 0.03 265 / 0.06);
  --shade: oklch(0.3 0.06 265 / 0.24);
  --accent: #0a84ff;
  --ok: #34c759;
  --warn: #ff9500;
  --fail: #ff3b30;
  /* 浅色底上彩色字要压深一点才读得清。 */
  --tone-shade: 24%;
  --mono: "SF Mono", ui-monospace, Menlo, Monaco, monospace;
  --ease: cubic-bezier(0.2, 0, 0, 1);
}
@media (prefers-color-scheme: dark) {
  :root {
    --ink: #f5f5f7;
    --ink-2: #d1d1d6;
    --ink-3: #a1a1a6;
    --ink-4: #7c7c80;
    --page: oklch(0.19 0.01 265);
    --glow-a: oklch(0.42 0.11 250 / 0.55);
    --glow-b: oklch(0.38 0.09 305 / 0.5);
    --card: oklch(0.27 0.008 265 / 0.55);
    --card-solid: oklch(0.25 0.008 265);
    --rim: oklch(1 0 0 / 0.12);
    --edge: oklch(1 0 0 / 0.09);
    --contact: oklch(0 0 0 / 0.25);
    --shade: oklch(0 0 0 / 0.55);
    --ok: #30d158;
    --warn: #ff9f0a;
    --fail: #ff453a;
    --tone-shade: 0%;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  display: grid;
  place-items: center;
  padding: 24px;
  font-family: var(--font);
  color: var(--ink);
  background:
    radial-gradient(38vmax 38vmax at 16% 10%, var(--glow-a), transparent 70%),
    radial-gradient(44vmax 44vmax at 88% 92%, var(--glow-b), transparent 70%),
    var(--page);
  -webkit-font-smoothing: antialiased;
}
.card {
  width: min(400px, 100%);
  padding: 40px 32px 20px;
  border-radius: 24px;
  text-align: center;
  background: var(--card);
  -webkit-backdrop-filter: blur(26px) saturate(180%);
  backdrop-filter: blur(26px) saturate(180%);
  box-shadow:
    inset 0 1px 0 var(--rim),
    0 0 0 1px var(--edge),
    0 1px 2px var(--contact),
    0 32px 64px -28px var(--shade);
  animation: rise 420ms var(--ease) both;
}

/* 品牌标：描线 → 填色；连接中轻轻呼吸。 */
.emblem { position: relative; width: 56px; height: 61px; margin: 4px auto 26px; color: var(--ink); }
.mark { display: block; width: 100%; height: 100%; overflow: visible; }
.mark-fill { fill: currentColor; animation: fade-in 350ms var(--ease) 620ms both; }
.mark-stroke {
  fill: none;
  stroke: currentColor;
  stroke-width: 14;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  animation:
    draw 760ms cubic-bezier(0.65, 0, 0.35, 1) 100ms both,
    fade-out 200ms var(--ease) 860ms forwards;
}
body[data-state="connecting"] .mark { animation: breathe 2.4s ease-in-out 1.2s infinite; }

/* 状态徽标：挂在品牌标右下角。 */
.badge {
  position: absolute;
  right: -14px;
  bottom: -8px;
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  color: #fff;
  background: var(--accent);
  box-shadow: 0 0 0 3px var(--card-solid), 0 6px 14px -4px var(--shade);
  transition: background-color 240ms var(--ease);
}
.badge svg { display: none; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
body[data-state="connecting"] .badge { color: var(--accent); background: var(--card-solid); }
body[data-state="connecting"] .i-spin { display: block; width: 20px; height: 20px; animation: spin 900ms linear infinite; }
body[data-state="ok"] .badge { background: var(--ok); }
body[data-state="next"] .badge { background: var(--accent); }
body[data-state="fail"] .badge { background: var(--fail); }
body[data-state="ok"] .i-ok,
body[data-state="next"] .i-next,
body[data-state="fail"] .i-fail { display: block; animation: pop 360ms cubic-bezier(0.34, 1.56, 0.64, 1) both; }
.i-ok path, .i-next path, .i-fail path { stroke-dasharray: 1; animation: draw 320ms var(--ease) 120ms both; }

h1 { margin: 0; font-size: 20px; font-weight: 600; line-height: 1.3; letter-spacing: -0.01em; text-wrap: balance; }
.account { margin: 8px 0 0; font-size: 14px; color: var(--ink-3); overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 14px; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: color-mix(in oklab, var(--tone), #000 var(--tone-shade));
  background: color-mix(in oklab, var(--tone) 14%, transparent);
}
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip[data-tone="ok"] { --tone: var(--ok); }
.chip[data-tone="warn"] { --tone: var(--warn); }
.chip[data-tone="info"] { --tone: var(--accent); }
.detail { margin: 14px 0 0; font-size: 13.5px; line-height: 1.65; color: var(--ink-2); text-wrap: pretty; overflow-wrap: anywhere; }
/* 「接下来可以」：左对齐的一小块，命令用等宽小胶囊、不折行。 */
.next {
  margin-top: 16px;
  padding: 12px 14px 12px;
  border-radius: 14px;
  text-align: left;
  background: color-mix(in oklab, var(--ink) 4%, transparent);
  box-shadow: inset 0 0 0 1px var(--edge);
}
.next-label { margin: 0 0 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-4); }
.steps { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.steps li { position: relative; padding-left: 14px; font-size: 13px; line-height: 1.6; color: var(--ink-2); overflow-wrap: anywhere; }
.steps li::before { content: ""; position: absolute; left: 2px; top: 0.66em; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
code {
  padding: 1px 6px;
  border-radius: 6px;
  font-family: var(--mono);
  font-size: 0.9em;
  color: var(--ink);
  background: color-mix(in oklab, var(--ink) 8%, transparent);
  white-space: nowrap;
}
.link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 18px;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 500;
  color: var(--accent);
  text-decoration: none;
  background: color-mix(in oklab, var(--accent) 12%, transparent);
  transition: background-color 120ms var(--ease);
}
.link:hover { background: color-mix(in oklab, var(--accent) 20%, transparent); }
.link::after { content: "↗"; font-size: 12px; }
.foot { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--edge); font-size: 12px; color: var(--ink-4); }
.swap { animation: swap 280ms var(--ease) both; }

@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(0.985); } }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes fade-in { from { opacity: 0; } }
@keyframes fade-out { to { opacity: 0; } }
@keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pop { from { opacity: 0; transform: scale(0.4); } }
@keyframes swap { from { opacity: 0; transform: translateY(4px); } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0ms !important; animation-delay: 0ms !important; transition-duration: 0ms !important; }
  body[data-state="connecting"] .i-spin { animation: none; }
}
</style>

<script>
// 授权码与 state 在地址栏里：换掉，免得留在历史记录、被截图带走。
try { history.replaceState(null, "", location.pathname); } catch (e) {}
var settled = false;
// 反引号里的部分显示成命令胶囊；只建文本节点，不解析 HTML。
function rich(el, text) {
  el.textContent = "";
  String(text || "").split("`").forEach(function (part, i) {
    if (!part) return;
    if (i % 2) {
      var code = document.createElement("code");
      code.textContent = part;
      el.appendChild(code);
    } else {
      el.appendChild(document.createTextNode(part));
    }
  });
}
function settle(o) {
  settled = true;
  var $ = function (id) { return document.getElementById(id); };
  document.body.setAttribute("data-state", o.state);
  document.title = o.title;
  $("title").textContent = o.title;
  $("account").textContent = o.account || "";
  $("account").hidden = !o.account;
  var chips = $("chips");
  chips.textContent = "";
  (o.chips || []).forEach(function (c) {
    var s = document.createElement("span");
    s.className = "chip";
    s.setAttribute("data-tone", c.tone);
    s.textContent = c.text;
    chips.appendChild(s);
  });
  chips.hidden = chips.childNodes.length === 0;
  rich($("detail"), o.detail);
  $("detail").hidden = !o.detail;
  var steps = $("steps");
  steps.textContent = "";
  (o.steps || []).forEach(function (text) {
    var li = document.createElement("li");
    rich(li, text);
    steps.appendChild(li);
  });
  $("next").hidden = steps.childNodes.length === 0;
  var link = $("link");
  if (o.link && /^https:\/\//.test(o.link.href)) {
    link.href = o.link.href;
    link.textContent = o.link.text;
    link.hidden = false;
  } else {
    link.hidden = true;
  }
  $("foot").textContent = o.foot || "";
  var content = $("content");
  content.classList.remove("swap");
  void content.offsetWidth;
  content.classList.add("swap");
}
// 连接关了还没等到结果：Dock 那头中断了这次登录（取消、出错、进程退出）。
window.addEventListener("load", function () {
  if (!settled) {
    settle({
      state: "fail",
      title: "这次登录中断了",
      detail: "Dock 没有给出结果，可能是登录被取消了。回到 Dock 看看，需要的话重新登录。",
      foot: "这一页可以关掉了"
    });
  }
});
</script>
