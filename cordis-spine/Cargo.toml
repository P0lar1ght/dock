[package]
name = "cordis-spine"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "DSH-shaped plugin spine with a Grok-shaped one-step agent turn"
license = "Apache-2.0"

[dependencies]
base64 = "0.22"
bm25 = "2.3"
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"
webbrowser = "1"
cordis = { path = "../cordis-rust" }
cordis-base = { path = "../cordis-base" }
futures-util = "0.3"
regex = "1"
reqwest = { version = "0.12", default-features = true, features = ["json", "stream", "gzip", "brotli", "deflate", "multipart"] }
htmd = "0.5.4"
arc-swap = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "process", "io-util", "net", "fs"] }
tokio-util = { version = "0.7", features = ["compat", "rt"] }
uuid = { version = "1", features = ["v7"] }
url = "2"
percent-encoding = "2.3"
indexmap = { version = "2", features = ["serde"] }
rhai = { version = "1.25", features = ["serde", "sync"] }
async-lsp = { version = "=0.2.3", features = ["tokio", "tracing"] }
async-trait = "0.1"
tracing = "0.1"
schemars = "0.8"
# workflow `agent(output_schema:)` 的产出契约校验。schemars 是生成 schema 的，
# 校验要另一颗；版本与 grok 对齐。
jsonschema = { version = "0.30", default-features = false }
libc = "0.2"
xai-workflow = { path = "../vendor/xai/workflow" }
chromiumoxide = { version = "0.9", default-features = true }
ignore = "0.4"
globset = "0.4"
# read_file document/multimodal (Grok-aligned)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
# Pure-Rust PDF engine (same as Grok). `rendering` enables page→JPEG
# (hayro-jpeg2000 needs rustc ≥ 1.92; dock MSRV is 1.94 to match live
# xai-org/grok-build). Default format=image.
pdf_oxide = { version = "0.3", features = ["rendering"] }
# PPTX: zip + DrawingML. default-features off avoids aes/bzip2/lzma/zstd.
zip = { version = "3", default-features = false, features = ["deflate-flate2"] }
quick-xml = "0.41"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
