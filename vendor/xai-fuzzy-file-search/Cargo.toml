[package]
license = "Apache-2.0"
name = "xai-fuzzy-file-search"
version = "0.1.0"
edition = "2024"
description = "Copied from grok-build xai-fuzzy-file-search (nucleo + ignore walker)"

[dependencies]
ignore = "0.4"
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "5b74652" }
serde = { version = "1", features = ["derive"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
