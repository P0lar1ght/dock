[package]
name = "xai-workflow"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rhai-scripted dynamic workflow engine (copied from grok-build xai-workflow)"

[dependencies]
rhai = { version = "1.25", features = ["serde", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", features = ["force-soft"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "rt"] }
tokio-util = "0.7"
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }
