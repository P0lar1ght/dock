[package]
name = "cordis-app"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Dock binary entry: install_app assembly + agent-loop + gateway + TUI"
license = "Apache-2.0"

# 对外二进制名。产品叫 dock；crate 名与库 crate `cordis-tui` 保持 cordis-* 前缀。
[[bin]]
name = "dock"
path = "src/main.rs"

[dependencies]
cordis = { path = "../cordis-rust" }
cordis-spine = { path = "../cordis-spine" }
cordis-tui = { path = "../cordis-tui" }
cordis-gateway = { path = "../cordis-gateway" }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "signal", "time", "io-std", "io-util"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
