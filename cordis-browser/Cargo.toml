[package]
name = "cordis-browser"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Dock 浏览器 MCP 服务：chromiumoxide CDP，按会话分标签页，`dock mcp browser` 跑在 stdio 上"
license = "Apache-2.0"

[dependencies]
# 和 chromiumoxide 同一个版本 / 特性（Cargo.lock 里已有）：跳转走一条单独的 CDP 连接，见 session.rs 的 goto_ready。
async-tungstenite = { version = "0.32", features = ["tokio-runtime"] }
base64 = "0.22"
chromiumoxide = { version = "0.9", default-features = true }
cordis-base = { path = "../cordis-base" }
# 审计：会话开着沙箱审计时，标签页的网络请求写进 Dock 给的审计目录（browser.jsonl）。
dock-sandbox = { path = "../dock-sandbox" }
futures-util = "0.3"
# 名册里别的 Dock 进程还活着吗（`kill(pid, 0)`），决定离开时关不关 Chromium；Cargo.lock 里已有。
libc = "0.2"
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "macros", "time", "io-std", "io-util", "fs", "process"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
