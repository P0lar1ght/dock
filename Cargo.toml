[workspace]
resolver = "2"
members = [
    "cordis-rust",
    "cordis-base",
    "cordis-spine",
    "cordis-tui",
    "cordis-gateway",
    "cordis-app",
    "dock-render/markdown",
    "dock-render/mermaid",
    "dock-render/third_party/ordered_hashmap",
    "dock-render/third_party/graphlib_rust",
    "dock-render/third_party/dagre_rust",
    "dock-render/third_party/mermaid-to-svg",
    "cordis-tui/fuzzy-file-search",
    "vendor/xai/workflow",
]

[workspace.package]
edition = "2021"
rust-version = "1.94"
license = "Apache-2.0"
version = "0.1.1"

# 调试信息占了构建产物的绝大头：`cordis-spine` 的 rlib 一份 200MB、`dock` 二进制
# 165MB，链接时间也随之走高。`line-tables-only` 保留 backtrace 的「文件:行」
# （测试和 panic 定位要的就是它），砍掉类型与局部变量的 DWARF。
#
# 要用 lldb 看局部变量时临时改回 `debug = true`，或跑 `--profile dev-debug`。
[profile.dev]
debug = "line-tables-only"

# 需要完整符号时用它：`cargo build --profile dev-debug`。
[profile.dev-debug]
inherits = "dev"
debug = true
