name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # gateway 测试打 loopback HTTP；代理环境必须放行回环地址，否则会成片 502。
  # 注意 env 的 key 大小写不敏感，不能同时写 no_proxy 和 NO_PROXY。
  NO_PROXY: "127.0.0.1,localhost,[::1]"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # 格式门禁：只覆盖第一方 crate，vendor/ 是冻结副本，不要格式化。
      - name: Format
        run: "cargo fmt --check -p cordis -p cordis-spine -p cordis-tui -p cordis-gateway -p cordis-app -p cordis-markdown -p xai-grok-mermaid"

      # lint 门禁：第一方 crate 已清零，这里挡住新增。vendor/ 冻结副本不参与。
      - name: Clippy
        # `--no-deps` 必须有：--locked 下的 workspace 成员含 vendor/ 冻结副本，
        # 不排除的话它们会一起被 lint，`-D warnings` 会被上游的既有 warning 打红
        # （2026-09 那次就是在 vendor/xai/workflow 上挂的）。
        run: cargo clippy --locked -p cordis -p cordis-spine -p cordis-tui -p cordis-gateway -p cordis-app -p cordis-markdown -p xai-grok-mermaid --all-targets --no-deps -- -D warnings

      # 默认回归集合里除 spine 之外的部分。
      - name: Test (gateway / tui / app)
        run: cargo test --locked -p cordis-gateway -p cordis-tui -p cordis-app

      # 需要真实 Chrome 的 browser 冒烟已标 #[ignore]；其余用例的进程级
      # DOCK_HOME / cwd 由 test_env::scoped() 串行化，可以并行跑。见 docs/DEVELOPMENT.md「CI」。
      - name: Test (spine)
        run: cargo test --locked -p cordis-spine
