name: Release

# tag 即发布点：v0.1.0 → Release v0.1.0。
# 先跑与 CI 同款的门禁 + tag/版本一致性，再矩阵构建四个平台的产物，
# 最后把 tar.gz + sha256 传上去（install.sh 从这里取）。
on:
  push:
    tags: ["v*"]

# 默认只读：verify / build 要编译并运行第三方 crate 的 build script 和整套测试，
# 不该拿着能建 Release、能写仓库内容的 token。写权限只给 release 这一个 job。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # gateway 测试打 loopback HTTP；代理环境必须放行回环地址，否则会成片 502。
  NO_PROXY: "127.0.0.1,localhost,[::1]"

jobs:
  verify:
    name: 门禁 + 版本一致性
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      # tag 与 Cargo.toml 的 workspace 版本必须同源，否则会发出版本号对不上的产物。
      # 必须把 version 限定在 [workspace.package] 段里取：根 Cargo.toml 以后加
      # [workspace.dependencies] 就会出现别的 version = "…"，取“第一条”会比错对象。
      - name: Tag 与 workspace 版本一致
        run: |
          set -eu
          want="${GITHUB_REF_NAME#v}"
          got=$(awk -F'"' '
            /^\[workspace\.package\]/ { in_sec = 1; next }
            /^\[/                     { in_sec = 0 }
            in_sec && /^version[[:space:]]*=/ { print $2; exit }
          ' Cargo.toml)
          if [ -z "$got" ]; then
            echo "没能从 Cargo.toml 的 [workspace.package] 里读到 version" >&2
            exit 1
          fi
          if [ "$want" != "$got" ]; then
            echo "tag ${GITHUB_REF_NAME} 与 Cargo.toml 的版本 ${got} 不一致" >&2
            exit 1
          fi

      - name: Format
        run: "cargo fmt --check -p cordis -p cordis-spine -p cordis-tui -p cordis-gateway -p cordis-app -p cordis-markdown -p xai-grok-mermaid"

      - name: Clippy
        run: cargo clippy --locked -p cordis -p cordis-spine -p cordis-tui -p cordis-gateway -p cordis-app -p cordis-markdown -p xai-grok-mermaid --all-targets --no-deps -- -D warnings

      - name: Test (gateway / tui / app)
        run: cargo test --locked -p cordis-gateway -p cordis-tui -p cordis-app

      - name: Test (spine)
        run: cargo test --locked -p cordis-spine

      # 内核单列（AGENTS.md 的「Commands」把它写成独立一条）。clippy --all-targets
      # 只编译不运行它的用例，不补这步就等于发版从没跑过 Context / inject / fiber 的测试。
      - name: Test (kernel)
        run: cargo test --locked -p cordis

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS 构建机都是 arm64，x86_64 产物走交叉编译。
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          # 两个 Linux 架构必须同一档 Ubuntu，否则 glibc 底线会一高一低（24.04 是
          # 2.39、22.04 是 2.35），同一台发行版上 x86_64 能跑、arm64 报 GLIBC_2.38
          # not found。22.04 系列 2026-09-17 起 deprecation（brownout 会直接让 job
          # 失败），所以往上对齐到 24.04。
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94.0"
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p cordis-app --target ${{ matrix.target }}

      # 产物名与 install.sh 的约定一致：dock-<target-triple>.tar.gz（+ .sha256）。
      - name: Package
        run: |
          set -eu
          file="dock-${{ matrix.target }}.tar.gz"
          tar -czf "$file" -C "target/${{ matrix.target }}/release" dock
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$file" > "$file.sha256"
          else
            shasum -a 256 "$file" > "$file.sha256"
          fi
          ls -lh "$file" "$file.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: dock-${{ matrix.target }}
          path: |
            dock-${{ matrix.target }}.tar.gz
            dock-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error

  release:
    name: 发布
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # 分成「建 Release」和「传产物」两步且都可重入：上传中途挂掉后重跑，
      # 一把梭的 gh release create 会因为 Release 已存在直接失败，产物一个都补不上。
      - name: 上传产物
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          ls -lh dist
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
